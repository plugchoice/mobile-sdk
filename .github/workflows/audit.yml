name: Dependency audit

# Known security advisories in the SDK's dependencies. CI runs it on every pull request and push
# to main (ci.yml); the daily run on main notices an advisory published since. What an app gets
# from the SDK fails at high and critical (CVSS 7 or more, or no score); test tooling fails at
# critical only. Exceptions go in osv-scanner.toml (Gradle) or under
# auditConfig.ignoreGhsas in react-native/pnpm-workspace.yaml, each with a reason (SECURITY.md).
on:
  workflow_call:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # https://github.com/google/osv-scanner/releases, checksum from osv-scanner_SHA256SUMS.
  OSV_SCANNER_VERSION: v2.7.1
  OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The React Native package has no dependencies of its own (expo is a peer dependency), so
      # --prod checks nothing today; it is there for the first one added. Everything else in the
      # lockfile is tooling for the package's own tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11
      - name: React Native package
        working-directory: react-native
        run: |
          status=0
          pnpm audit --prod --audit-level high || status=1
          pnpm audit --audit-level critical || status=1
          exit $status

      - name: Install osv-scanner
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android library
        if: ${{ !cancelled() }}
        run: .github/scripts/audit-android.sh

      # The Swift package has no dependencies (Package.swift), so there is nothing to check. When
      # one is added, commit Package.resolved and scan it here like the Gradle lockfile.
